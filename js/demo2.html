<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let aa = 10;
        console.log("我是日志");
        console.log(typeof aa);

        let bb = "hello";
        let bb2 = 'hello';
        console.log(bb);
        console.log(bb2);

        let cc;
        console.log(cc);

        let dd = true;
        console.log(dd);

        console.log("5/2=" + (5/2));

        let ee = '10';
        console.log("aa==ee:" + (aa==ee));
        console.log("aa===ee:" + (aa===ee));

        //数组
        let arr = new Array();
        console.log(arr);
        console.log(typeof arr);
        let arr2 = [];
        console.log(arr2);
        console.log(typeof arr2);
        let arr3 = [1, 2, "e", "hello", true];
        console.log(arr3);
        console.log(typeof arr3);

        //增删查改
        arr2[0] = 'aa';
        arr2[1] = 'bb';
        arr2[10] = "cc";
        console.log(arr2);

        let arr4 = [];
        arr4["hello"] = "array";
        arr4[-3] = "-3";
        console.log(arr4); //长度为0,，说明前面2个不计入数组长度，但有元素有值
        //修改
        arr2[10] = "ee";
        console.log(arr2);
        //查
        console.log(arr3[3]);
        //删
        arr3.splice(2,3);
        console.log(arr3);

        //函数定义
        function hello() {
            console.log("hello hello");
        }
        hello();
        function add(x,y) {
            let sum = x + y;
            console.log(x + y);
            return sum;
        }
        add(5,9);

        function add2(x,y) {
            let sum = x + y;
            console.log(x + "+" + y + "=" + sum);
            return sum;
        }
        add2(5,9);
        add2("aa",2);
        add2("aa","bb");
        add2("aa");
        add2("aa","bb","cc");
        add2(5);
        add2(false);
        add2(true,false);
        add2(true,2); //true=1,false=0

        let sum = function (x,y) {
            return x + y;
        }
        console.log(sum);
        console.log(typeof sum);
        
        console.log(sum(2,3));

        let obj = {};
        let obj2 = new Object(); //对象
        let arr5 = new Array(); //数组
        let stu = { //类里面的属性 使用,隔开；方法里面就是正常;割开
            'id':5,
            "name":'zhangsan',//value 非数字、关键字的 剩下的就是字符串，需要引号引起来的
            age:18,
            function111222:function(x,y) {
                return x + y;
            },
        }
        console.log(typeof stu);
        console.log(stu);

        let obj3 = {};
        obj3.name = 'lisi';
        obj3.id = 5;
        obj3.funct = function(x,y) {return x + y};
        console.log(obj3);
        obj3["name"] = 'wangwu';
        obj3['name'] = '123';
        obj3['id'] = 4;
        obj3['qq'] = '1234567';
        console.log(obj3);
        console.log(stu);
        
        //构造函数
        function Cat(age, color, name) { //构造方法首字母大写
            this.age = age;
            this.color = color;
            this.name = name;
            return 111;
        }
        let xiaohuang = new Cat(1, 'yellow', "xiaohuang"); // 除数字、关键字外，纯字母就是没有类型 不能作为参数的
        console.log(xiaohuang);
        let xiaohuang2 = Cat(1, 'yellow', "xiaohuang"); // 构造方法执行了，没有创建对象
        console.log(xiaohuang2);//111
        console.log(xiaohuang.name);//xiaohuang
        console.log(xiaohuang2.name); //notdefined，构造方法前面没有使用new，虽然能调用此方法 但是没有创建对象

        console.log(Cat(1, 'yellow', "xiaohuang"));//111
        
    </script>
    <script>
        src="jquery-3.7.1.min.js"
    </script>
</body>
</html>
