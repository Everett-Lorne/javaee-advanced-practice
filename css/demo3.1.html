<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: red 10px solid;
            /*border等同于： */
            border-width: 10px;
            border-style: solid;
            border-color: red;

            /* border-width等同于： */
            border-top-width: 2px;
            border-bottom-width: 5px;
            border-left-width: 8px;
            border-right-width: 10px;

            border-width: 2px 5px 8px 10px;/* 上右下左 */
            border-width: 2px 10px;/* 上下2px，左右10px */
            border-width: 2px 5px 10px;/* 上 左右 下 */

            border-style: solid;
            border-top-style: dotted;
            border-right-style: dashed;
            border-bottom-style: groove;
            border-left-style: double;

            border-color: red green;
            border-color: red green yellow purple;

            width: 500px;
            height: 100px;
            /* 宽度高度指的是文本内容边框的长度，不包括边框 */
        }
        span {
            /* style: solid; */
            border: 10px purple solid;
            color: red;
            /* 无效 */
            width: 500px;
            height:100px;
            /* 变成块级元素有效： */
            display: block;
        }
    </style>
</head>
<body>
    <div class="text1" >我是文本1</div>
    <div class="text1" style="border: green solid 400px;">我是文本1</div>
    <span>span111</span>

</body>
</html>
